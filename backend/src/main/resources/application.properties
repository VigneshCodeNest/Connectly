# ===================================================================
# Connectly Messaging Application - Spring Boot Foundation (Phase 1)
# ===================================================================
spring.application.name=connectly-backend
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# Active Profile (dev | test | prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Datasource Configuration with Environment Variable Support
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/connectly_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Multipart File Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging Configuration
logging.level.com.connectly=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
